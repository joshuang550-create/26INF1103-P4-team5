name: SmartBite Automated Test Suite

on:
  push:
  pull_request:
  workflow_dispatch:   # lets you press "Run workflow" manually on the Actions tab

permissions:
  contents: read

jobs:
  automated-tests:
    name: Build image and run tests in Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t smartbite:test .

      # No API key or internet needed: the AI is faked in the tests.
      - name: Run test suite including GUI 
        run: - name: Run all tests including GUI
  run: docker run --rm -e SMARTBITE_REQUIRE_GUI_TESTS=1 smartbite:test timeout 90s xvfb-run -a python -u -m unittest discover -s tests -t . -v
  
