name: SmartBite Automated Test Suite

# Trigger the workflow whenever code is pushed or a pull request is opened/updated.
on:
  push:
  pull_request:

# Give the workflow read-only access to the repository.
permissions:
  contents: read

jobs:
  automated-tests:
    name: Build and Test Python Application

    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repository code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Python.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Step 3: Install Python dependencies.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # Step 4: Build the Docker image.
      - name: Build Docker image
        run: |
          docker build -t smartbite:test .
    
      # Step 5: Run the Docker container.
      - name: Run Docker container
        run: |
          docker run --rm smartbite:test python -m unittest discover -s tests -t . -v
            
      # Step 6: Run the Python application.
      - name: Run Python application
        run: |
          python main.py
